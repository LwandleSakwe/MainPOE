   name: TestJava

   # Runs all the unit tests whenever code is pushed or a pull request is opened.
   on:
     push:
     pull_request:

   jobs:
     test:
       runs-on: ubuntu-latest

       steps:
         - name: Get the code
           uses: actions/checkout@v4

         - name: Set up Java 17
           uses: actions/setup-java@v4
           with:
             java-version: '17'
             distribution: 'temurin'
             cache: maven

         - name: Run the unit tests
           run: mvn -B test
